name: HCTN CI
on:
  push:
  pull_request:
jobs:
  amazon-alexa-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amazon-build-ship-shape-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
